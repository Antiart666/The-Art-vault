<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><title>Suss Miniatyrer - Diverse</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:ital,wght@1,600&display=swap');

:root {
  --bg-color: #0d1117;
  --paper-base: #e2dac7; 
  --text-dark: #2a2a2a;
  --text-bright: #ffffff;
  --accent: #f85149;
}

body {
  margin: 0; padding: 0; 
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-color);
  background-image: url('background.jpg');
  background-attachment: fixed; 
  background-size: cover;
}

.main-nav { 
    background: rgba(13, 17, 23, 0.95); 
    border-bottom: 1px solid #444; 
    position: sticky; top: 0; z-index: 1000; height: 90px;
}

.nav-container { 
    max-width: 1400px; margin: 0 auto; padding: 0 30px; height: 100%; 
    display: flex; justify-content: space-between; align-items: center;
}

.logo { max-height: 60px; transform: rotate(-3deg); cursor: pointer; }

.nav-links { list-style: none; display: flex; gap: 20px; margin: 0; }
.nav-item { position: relative; }
.nav-item > a { color: var(--text-bright); text-decoration: none; font-size: 0.9rem; text-transform: lowercase; }

.dropdown { 
    display: none; position: absolute; top: 30px; left: 0; 
    background: #1c2128; min-width: 200px; border: 1px solid #444;
}
.dropdown a { display: block; padding: 10px; color: white; text-decoration: none; font-size: 0.8rem; }
.nav-item:hover .dropdown { display: block; }

.gallery-container { 
    max-width: 1200px; margin: 50px auto; padding: 0 20px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    grid-gap: 20px;
}

.art-card { 
    background: var(--paper-base); padding: 10px; border-radius: 4px;
    box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
    transition: transform 0.3s; cursor: pointer;
}
.art-card:hover { transform: scale(1.02) rotate(1deg); }
.art-card img { width: 100%; height: auto; display: block; border-radius: 2px; }

h1 { font-family: 'Playfair Display', serif; color: white; text-align: center; margin-top: 40px; font-style: italic; }

/* LIGHTBOX */
#lightbox {
    display: none; position: fixed; z-index: 2000; top: 0; left: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.9);
    justify-content: center; align-items: center;
}
#lightbox img { max-width: 90%; max-height: 90%; border: 5px solid white; }

@media (max-width: 800px) {
    .nav-links { display: none; }
    .gallery-container { grid-template-columns: 1fr; }
}
</style></head>
